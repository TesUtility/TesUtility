workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Build Android
        script: ./gradlew :androidApp:assembleDebug
    artifacts:
      - androidApp/build/outputs/**/*.apk
scripts:
  - name: Download libv2ray.aar
    script: |
      mkdir -p androidApp/libs
      curl -L -o androidApp/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar"

  - name: Build Android
    script: ./gradlew :androidApp:assembleDebug
